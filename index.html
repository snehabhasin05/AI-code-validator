<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
        }
        h1 {
            margin-top: 20px;
        }
        textarea {
            width: 80%;
            height: 200px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .loader {
            display: none;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .valid {
            color: green;
            background-color: #e8f5e9;
        }
        .invalid {
            color: red;
            background-color: #ffebee;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>AI Code Validator</h1>
    <textarea id="codeInput" placeholder="Enter your code here..." rows = "10" cols="50"></textarea><br>
    <button onclick="validateCode()">Submit</button>
    <div id="loading" class="loader"></div>
    <div id="result"></div>

    <script>
        async function validateCode() {
            const code = document.getElementById("codeInput").value;
            const resultDiv = document.getElementById("result");
            const loadingDiv = document.getElementById("loading");

            resultDiv.innerHTML = "";
            loadingDiv.style.display = "inline-block";

            try {
                const response = await fetch(
                    "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-pro:generateContent?key=AIzaSyAOGLD_C-LXRxA2CIp4P2oCk8E8BgnkEJg",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Is the following code valid? ${code}` }] }]
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();

                const resultText = data.candidates[0].content.parts[0].text;
                const isValid = resultText.toLowerCase().includes("valid");

                loadingDiv.style.display = "none";
                resultDiv.innerHTML = `<strong>Result:</strong> ${resultText}`;
                resultDiv.className = isValid ? "result valid" : "result invalid";
            } catch (error) {
                resultDiv.innerHTML = "Error validating code. Please try again.";
            }

            loadingDiv.style.display = "none";
        }
    </script>
</body>

</html>
